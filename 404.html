<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .error-container { text-align: center; }
        .error-code { font-size: clamp(5rem, 15vw, 10rem); color: var(--accent-color); margin: 0; line-height: 1; }
        h2 { margin: 20px 0; }
        .back-link { 
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white !important;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .back-link:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2>Oops! The page you are looking for has been smoked.</h2>
        <p>Maybe it went for a cigarette break?</p>
        <a href="index.html" style="color: var(--accent-color); font-weight: bold;">Return to Home</a>
    </div>
</body>
</html>
