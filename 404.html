<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container { text-align: center; padding: 100px 5%; }
        .error-code { font-size: 8rem; color: var(--accent-color); margin: 0; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2>Oops! The page you are looking for has been smoked.</h2>
        <p>Maybe it went for a cigarette break?</p>
        <a href="index.html" style="color: var(--accent-color); font-weight: bold;">Return to Home</a>
    </div>
</body>
</html>
